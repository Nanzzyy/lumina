# Patched versions for transitive dependencies with advisories (pnpm 11 reads
# overrides here, not from the package.json "pnpm" field).
overrides:
  postcss@<8.5.18: '>=8.5.18'
  brace-expansion@1: '>=1.1.17 <2'
  brace-expansion@5: '>=5.0.9'
  sharp@<0.35.0: '>=0.35.3'
  # Pinned below the latest release: 3.3.17 is too new for the minimumReleaseAge policy.
  nanoid@3: 3.3.15

allowBuilds:
  better-sqlite3: true
  sharp: true
  unrs-resolver: true
